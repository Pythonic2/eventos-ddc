steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - --tag
      - southamerica-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/eventos-ddc:$COMMIT_SHA
      - .

  - name: gcr.io/cloud-builders/docker
    args:
      - push
      - southamerica-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/eventos-ddc:$COMMIT_SHA

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - eventos-ddc
      - --image=southamerica-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/eventos-ddc:$COMMIT_SHA
      - --region=southamerica-east1
      - --service-account=926822874156-compute@developer.gserviceaccount.com
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=1
      - --concurrency=1
      - --memory=512Mi
      - --cpu=1
      - --timeout=120
      - --quiet

images:
  - southamerica-east1-docker.pkg.dev/$PROJECT_ID/cloud-run-source-deploy/eventos-ddc:$COMMIT_SHA

options:
  logging: CLOUD_LOGGING_ONLY

timeout: 1200s
